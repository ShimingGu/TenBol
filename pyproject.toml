[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenbol"
version = "0.1.0"
description = "Tenbol: modular batched Einstein-Boltzmann solver for MCMC matter power"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
reference = ["camb>=2.0.5", "scipy>=1.10"]
torch = ["torch>=2.4"]
cuda = ["cupy-cuda13x[ctk]>=14", "scipy>=1.10"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["tenbol*"]

[tool.setuptools.package-data]
"tenbol.backends" = ["trajectory.cu"]

[tool.pytest.ini_options]
testpaths = ["tests/tenbol"]
markers = ["slow: long-running validation or benchmark tests"]
